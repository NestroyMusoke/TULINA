name: verify
on: [push, pull_request]
jobs:
  phase-1-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Phase 1 runtime dependency
        run: python -m pip install "pydantic>=2.10,<3"
      - name: Verify canonical fixture integrity
        run: python scripts/verify_phase0.py
      - name: Run domain and persistence tests
        run: python -m unittest discover -s backend/tests -v
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Verify durable fixture seed
        run: python -m backend.tulina.cli seed --database work/ci-phase1.sqlite3 --reset

  # Phase 2 will add a separate web job after its dependency lock,
  # application entry points, and browser tests are committed.
