name: verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install tested backend dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify canonical fixture integrity
        run: python scripts/verify_phase0.py
      - name: Scan repository for high-confidence secrets
        run: python scripts/scan_secrets.py
      - name: Lint backend
        run: python -m ruff check backend
      - name: Run domain, persistence, and API tests
        run: python -m unittest discover -s backend/tests -v
      - name: Compile Python sources
        run: python -m compileall -q backend
      - name: Verify Phase 7 deployment assets
        run: python scripts/verify_phase7.py
      - name: Verify durable fixture seed
        run: python -m backend.tulina.cli seed --database work/ci-phase3.sqlite3 --reset
      - name: Prove background ADK fleet without a chat prompt
        env:
          TULINA_MODE: fixture
          TULINA_QUEUE: local
          TULINA_AGENT_STEP_DELAY_MS: "0"
        run: python -m backend.tulina.agents.cli --database work/ci-agent.sqlite3 --reset

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Run component tests
        run: npm --prefix frontend run test
      - name: Build production PWA
        run: npm --prefix frontend run build
      - name: Verify submission packet and bundle budgets
        run: python scripts/verify_phase8.py
      - name: Audit production and test dependencies
        run: npm audit --prefix frontend --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked application dependencies
        run: |
          python -m pip install -e ".[dev]"
          npm ci --prefix frontend
      - name: Install isolated Chromium runtime
        run: npm --prefix frontend exec -- playwright install --with-deps chromium
      - name: Run canonical offline browser journey and QA
        run: npm --prefix frontend run test:e2e

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Build API container
        run: docker build --file Dockerfile --tag tulina-api:ci .
      - name: Build web container
        run: >-
          docker build --file frontend/Dockerfile
          --build-arg VITE_API_URL=https://api.example.invalid
          --tag tulina-web:ci .
