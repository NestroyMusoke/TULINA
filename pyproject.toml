[project]
name = "tulina"
version = "0.1.0"
description = "Offline-safe district medicine redistribution agents"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.133,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "cryptography>=43,<46",
  "python-multipart>=0.0.18,<1",
  "google-adk>=2.1,<3",
  "google-cloud-firestore>=2.19,<3",
  "google-cloud-pubsub>=2.27,<3",
  "google-cloud-kms>=3.2,<4",
  "google-auth>=2.38,<3",
  "google-genai>=1.75,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<1", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"backend/tulina/api.py" = ["B008"]
